name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      QT_QUICK_CONTROLS_STYLE: Basic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/sync_widget_sources.py --check
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tests/check_qml.py
      - run: python tests/check_widget_editor.py
      - run: python app.py --smoke-test
      - run: node tests/test-calendar.cjs && node tests/test-search.cjs && node tests/test-undated.cjs && node tests/test-widget-sharing.cjs && node tests/test-english.cjs && node tests/test-task-completion.cjs && node tests/test-task-organization.cjs && node tests/test-weekdays.cjs
